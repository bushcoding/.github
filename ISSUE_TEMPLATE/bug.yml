name: Reportar un error
description: Algo no funciona como debería.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: producto
    attributes:
      label: Producto
      options:
        - Stash
        - Aptly
        - Classify
        - Germina
        - bushcoding.com
        - Otro
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describí el error y, si apareció, copiá el mensaje exacto.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a ...
        2. Tocar ...
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador / dispositivo
      placeholder: "Ej.: Chrome 130 en Windows, Safari en iPhone 15"
    validations:
      required: false
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Arrastrá imágenes o videos acá. No incluyas datos personales ni claves.
    validations:
      required: false
